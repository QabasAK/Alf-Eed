name: jslexicon
description: "Jordanian Sign Language Engineering Lexicon"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  provider: ^6.1.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/animations/engineering_basics/
    - assets/animations/electrical_engineering/
    - assets/animations/computer_engineering/
    - assets/signs/engineering_basics/
    - assets/signs/electrical_engineering/
    - assets/signs/computer_engineering/
    - assets/letters/
